<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wsnh2022 blog: tools I build and what I learn</title>
    <meta name="description" content="Write-ups of the tools I build and notes on what I learn, each project post read live from its GitHub README." />
</head>

<body>
    <div id="root"></div>
    <script>
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); } catch (e) {}
      if ('IntersectionObserver' in window) document.documentElement.classList.add('motion');
    </script>
    <script>
      // Restore path encoded by 404.html redirect
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
